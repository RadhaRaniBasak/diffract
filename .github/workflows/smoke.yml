name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        mcp: ["mcp>=1.9,<2", "mcp>=2,<3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install "${{ matrix.mcp }}" pytest
      - name: Smoke test (split, verify, repair, drift proof, report, publish, automatic mode, MCP round-trip)
        run: python mcp/smoke_test.py
